<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Live Stream Premium</title>
<!-- Google Fonts for Modern Typography -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-SMZXC121E6');
</script>
<style>
  :root {
    --bg-dark: #050505;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --primary-glow: rgba(42, 171, 238, 0.4);
    --tg-blue: #2AABEE;
  }
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
  }
  
  body, html {
    background-color: var(--bg-dark);
    color: #fff;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Ambient Background Glow */
  .ambient-light {
    position: absolute;
    width: 60vw;
    height: 60vh;
    background: radial-gradient(circle, var(--primary-glow) 0%, transparent 60%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    opacity: 0.6;
    pointer-events: none;
    animation: pulseGlow 4s infinite alternate;
  }

  @keyframes pulseGlow {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
    100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.7; }
  }

  /* Main Video Container */
  .app-container {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 20px;
    justify-content: center; /* Centers video vertically */
  }

  .player-wrapper {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(42, 171, 238, 0.15);
    /* Forces widescreen aspect ratio to remove huge black top/bottom bars on mobile */
    aspect-ratio: 16 / 9;
    max-height: 80vh;
  }

  #main-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
  }

  /* Floating Bottom Bar (Glassmorphism) */
  .floating-footer {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    padding: 10px 20px 30px 20px; /* Extra bottom padding for phone swipe bar */
    padding-bottom: max(30px, env(safe-area-inset-bottom));
  }

  .glass-bar {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 10px 20px;
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    width: auto;
    max-width: 100%;
  }

  .support-text {
    margin-right: 15px;
    font-weight: 600;
    font-size: 14px;
    color: #cbd5e1;
  }

  .telegram-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(135deg, #2AABEE, #1c88c3);
    padding: 12px 24px;
    border-radius: 50px;
    text-decoration: none;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 4px 15px var(--primary-glow);
    position: relative;
    overflow: hidden;
  }

  .telegram-btn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: rgba(255,255,255,0.2);
    transform: rotate(45deg) translateX(-100%);
    transition: all 0.5s ease;
  }

  .telegram-btn:hover::after {
    transform: rotate(45deg) translateX(100%);
  }

  .telegram-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px var(--primary-glow);
  }

  .telegram-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .telegram-icon svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }

  /* Custom Join Modal */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s ease;
  }

  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .modal-content {
    background: rgba(25, 30, 40, 0.8);
    border: 1px solid var(--glass-border);
    padding: 40px 30px;
    border-radius: 24px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    transform: translateY(20px) scale(0.95);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }

  .modal-overlay.active .modal-content {
    transform: translateY(0) scale(1);
  }

  .modal-icon {
    width: 60px;
    height: 60px;
    background: rgba(42, 171, 238, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    border: 2px solid var(--tg-blue);
  }

  .modal-icon svg {
    width: 30px;
    height: 30px;
    fill: var(--tg-blue);
  }

  .modal-content h2 {
    font-size: 22px;
    margin-bottom: 10px;
    font-weight: 800;
  }

  .modal-content p {
    color: #a0aec0;
    font-size: 14px;
    margin-bottom: 25px;
    line-height: 1.5;
  }

  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn-join {
    background: var(--tg-blue);
    color: white;
    text-decoration: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 16px;
    transition: background 0.3s;
  }

  .btn-skip {
    background: transparent;
    color: #a0aec0;
    border: none;
    padding: 12px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  /* Loader and Error States */
  .loader-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    z-index: 1;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--tg-blue);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  .status-text {
    font-size: 12px;
    color: #a0aec0;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* --- MOBILE OPTIMIZATIONS --- */
  @media (max-width: 600px) {
    .app-container {
      padding: 10px;
      gap: 15px;
    }
    .player-wrapper {
      border-radius: 12px;
    }
    .glass-bar {
      width: 100%;
      padding: 8px;
    }
    .support-text {
      display: none; /* Hides "Support Us" on mobile so the button fits perfectly */
    }
    .telegram-btn {
      width: 100%;
      padding: 14px 20px;
    }
    .floating-footer {
      padding: 10px 10px 20px 10px;
    }
  }
</style>
</head>
<body>

<div class="ambient-light"></div>

<div class="app-container">
  <!-- Video Player Box -->
  <div class="player-wrapper">
    <div class="loader-container" id="loading-state">
      <div class="spinner"></div>
      <div class="status-text" id="status-message">Connecting...</div>
    </div>
    
    <iframe id="main-iframe" 
            allowfullscreen 
            allow="encrypted-media; fullscreen; autoplay" 
            sandbox="allow-scripts allow-same-origin allow-presentation"
            style="opacity: 0; transition: opacity 0.5s ease;">
    </iframe>
  </div>

  <!-- Glassmorphism Bottom Bar -->
  <div class="floating-footer">
    <div class="glass-bar">
      <span class="support-text">Support Us:</span>
      <a href="https://t.me/+w_oKk-2R2OgyNDNl" target="_blank" class="telegram-btn">
        <div class="telegram-icon">
          <svg viewBox="0 0 24 24">
            <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"/>
          </svg>
        </div>
        <span>Join @crixzy</span>
      </a>
    </div>
  </div>
</div>

<!-- Custom Glassmorphism Welcome Modal -->
<div class="modal-overlay" id="tg-modal">
  <div class="modal-content">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24">
        <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"/>
      </svg>
    </div>
    <h2>Join our Telegram!</h2>
    <p>Get instant updates, backup links, and chat with the community. Don't miss out!</p>
    <div class="modal-actions">
      <a href="https://t.me/+w_oKk-2R2OgyNDNl" target="_blank" class="btn-join" id="btn-join-now">Join Channel Now</a>
      <button class="btn-skip" id="btn-skip">Maybe Later</button>
    </div>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {

  const modal = document.getElementById('tg-modal');
  const skipBtn = document.getElementById('btn-skip');
  const joinBtn = document.getElementById('btn-join-now');

  setTimeout(() => { modal.classList.add('active'); }, 300);

  const closeModal = () => modal.classList.remove('active');
  skipBtn.addEventListener('click', closeModal);
  joinBtn.addEventListener('click', closeModal);

  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  const iframe = document.getElementById('main-iframe');
  const loader = document.getElementById('loading-state');
  const statusMsg = document.getElementById('status-message');

  if (id) {
    fetch('https://allrounder2-0.pages.dev/id.json')
      .then(res => res.json())
      .then(data => {
        const targetData = data.iframes.find(item => item.id === id);
        
        if (targetData && targetData.iframeSrc) {
          iframe.src = targetData.iframeSrc;
          
          iframe.onload = () => {
            loader.style.display = 'none';
            iframe.style.opacity = '1';
          };

          if (targetData.hit) {
            fetch(targetData.hit).catch(() => {});
          }
        } else {
          showError("Stream not found or expired.");
        }
      })
      .catch(() => {
        showError("Failed to load stream data.");
      });
  } else {
    showError("Invalid URL. No stream ID provided.");
  }

  function showError(msg) {
    const spinner = document.querySelector('.spinner');
    if (spinner) spinner.style.display = 'none';
    statusMsg.style.color = '#ef4444';
    statusMsg.innerText = msg;
  }

});
</script>
</body>
</html>
