<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Stream</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-SMZXC121E6');
</script>
<style>
  :root {
    --bg-main: #0f172a;
    --bg-stream: #000000;
  }
  
  * {
    box-sizing: border-box;
  }
  
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-main);
    overflow: hidden;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Video wrapper taking up most of the screen */
  .video-container {
    flex: 1;
    width: 100%;
    position: relative;
    background: var(--bg-stream);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
  }

  #main-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Modern Footer for the Telegram Button */
  .footer {
    height: 85px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111827;
    border-top: 1px solid #1f2937;
    padding: 0 20px;
    z-index: 10;
  }

  .telegram-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #2AABEE, #229ED9);
    padding: 14px 28px;
    border-radius: 50px;
    text-decoration: none;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(42, 171, 238, 0.25);
  }

  .telegram-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(42, 171, 238, 0.45);
    background: linear-gradient(135deg, #35B3F4, #27A6E2);
  }

  .telegram-icon {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .telegram-icon svg {
    width: 24px;
    height: 24px;
    fill: #fff;
  }

  /* Centered Error Message */
  .error-msg {
    color: #ef4444;
    text-align: center;
    font-family: inherit;
    position: absolute;
    width: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(17, 24, 39, 0.9);
    padding: 20px 40px;
    border-radius: 12px;
    border: 1px solid #374151;
    display: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div class="video-container">
  <!-- 
    The sandbox attribute is the key to blocking popups and new tabs!
    It prevents any inside link from executing a popup or redirecting your page.
  -->
  <iframe id="main-iframe" 
          allowfullscreen 
          allow="encrypted-media; fullscreen; autoplay" 
          sandbox="allow-scripts allow-same-origin allow-presentation">
  </iframe>
  <h2 id="error-text" class="error-msg"></h2>
</div>

<div class="footer">
  <a href="https://t.me/+w_oKk-2R2OgyNDNl" target="_blank" class="telegram-btn">
    <div class="telegram-icon">
      <svg viewBox="0 0 24 24">
        <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"/>
      </svg>
    </div>
    <span>Join @crixzy</span>
  </a>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {

  // Original Confirm Logic
  const join = confirm("Join Our Telegram Channel");
  if (join) {
    location.href = "https://t.me/+w_oKk-2R2OgyNDNl";
  }

  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  const iframe = document.getElementById('main-iframe');

  if (id) {
    fetch('https://allrounder2-0.pages.dev/id.json')
      .then(res => res.json())
      .then(data => {
        const targetData = data.iframes.find(item => item.id === id);
        if (targetData && targetData.iframeSrc) {
          iframe.src = targetData.iframeSrc;

          if (targetData.hit) {
            fetch(targetData.hit).catch(() => {});
          }
        } else {
          showError("Stream not found");
        }
      })
      .catch(() => {
        showError("Error loading data");
      });
  } else {
    showError("No ID provided in the URL.");
  }

  function showError(msg) {
    const errorEl = document.getElementById('error-text');
    errorEl.innerText = msg;
    errorEl.style.display = 'block';
    iframe.style.display = 'none';
  }

});
</script>
</body>
</html>
