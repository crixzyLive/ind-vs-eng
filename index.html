<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Live Stream Premium</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-SMZXC121E6');
</script>
<style>
  :root {
    --bg-dark: #050505;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --primary-glow: rgba(42, 171, 238, 0.4);
    --movie-glow: rgba(255, 65, 108, 0.4);
    --tg-blue: #2AABEE;
    --movie-red: #ff416c;
    --movie-gradient: linear-gradient(135deg, #ff4b2b, #ff416c);
  }
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
  }
  
  body, html {
    background-color: var(--bg-dark);
    color: #fff;
    width: 100vw;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto; /* Changed to auto so search bar is reachable on small screens */
    display: flex;
    flex-direction: column;
  }

  /* Ambient Background Glows */
  .ambient-light-1 {
    position: fixed;
    width: 60vw;
    height: 60vh;
    background: radial-gradient(circle, var(--primary-glow) 0%, transparent 60%);
    top: 30%;
    left: 20%;
    transform: translate(-50%, -50%);
    z-index: 0;
    opacity: 0.5;
    pointer-events: none;
    animation: pulseGlow 5s infinite alternate;
  }
  .ambient-light-2 {
    position: fixed;
    width: 50vw;
    height: 50vh;
    background: radial-gradient(circle, var(--movie-glow) 0%, transparent 60%);
    bottom: 0;
    right: 0;
    z-index: 0;
    opacity: 0.3;
    pointer-events: none;
    animation: pulseGlow 6s infinite alternate-reverse;
  }

  @keyframes pulseGlow {
    0% { transform: scale(1); opacity: 0.3; }
    100% { transform: scale(1.1); opacity: 0.6; }
  }

  /* Main Container */
  .app-container {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 25px;
    align-items: center;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* --- 1. Video Player --- */
  .player-wrapper {
    width: 100%;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(42, 171, 238, 0.15);
    aspect-ratio: 16 / 9;
    max-height: 75vh;
  }

  #main-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
  }

  /* --- 2. Telegram Support Bar --- */
  .glass-bar {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 12px 24px;
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .support-text {
    font-weight: 600;
    font-size: 15px;
    color: #cbd5e1;
  }

  .telegram-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(135deg, #2AABEE, #1c88c3);
    padding: 12px 28px;
    border-radius: 50px;
    text-decoration: none;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px var(--primary-glow);
  }
  .telegram-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px var(--primary-glow);
  }

  /* --- 3. Movie Search Bar --- */
  .movie-search-wrapper {
    width: 100%;
    background: rgba(20, 20, 25, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 65, 108, 0.3);
    padding: 15px 24px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 65, 108, 0.05);
  }

  .movie-search-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    color: #f8fafc;
  }
  .movie-search-header span {
    font-size: 20px; /* emoji size */
  }

  .search-input-group {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .search-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 14px 20px;
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: all 0.3s ease;
  }
  .search-input:focus {
    border-color: var(--movie-red);
    box-shadow: 0 0 15px var(--movie-glow);
  }
  .search-input::placeholder {
    color: #64748b;
  }

  .search-btn {
    background: var(--movie-gradient);
    border: none;
    border-radius: 12px;
    padding: 0 24px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px var(--movie-glow);
  }
  .search-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px var(--movie-glow);
  }

  /* --- Periodic Auto-Skip Toast Notification --- */
  .promo-toast {
    position: fixed;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(25, 25, 30, 0.95);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 65, 108, 0.4);
    border-radius: 16px;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px var(--movie-glow);
    z-index: 99999;
    opacity: 0;
    visibility: hidden;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    width: 90%;
    max-width: 450px;
    overflow: hidden;
  }

  .promo-toast.show {
    top: 20px;
    opacity: 1;
    visibility: visible;
  }

  .promo-icon {
    font-size: 28px;
    background: var(--movie-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .promo-text {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    line-height: 1.4;
  }

  /* The 5 second countdown bar */
  .progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 4px;
    background: var(--movie-gradient);
    width: 100%;
    transform-origin: left;
  }
  .promo-toast.show .progress-bar {
    animation: shrinkProgress 5s linear forwards;
  }
  @keyframes shrinkProgress {
    0% { transform: scaleX(1); }
    100% { transform: scaleX(0); }
  }

  /* --- Welcome Modal (Maintained from before) --- */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: all 0.4s ease;
  }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  .modal-content {
    background: rgba(25, 30, 40, 0.9);
    border: 1px solid var(--glass-border);
    padding: 40px 30px; border-radius: 24px; text-align: center;
    max-width: 400px; width: 90%;
    transform: translateY(20px) scale(0.95);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
  .modal-content h2 { font-size: 22px; margin-bottom: 10px; font-weight: 800; }
  .modal-content p { color: #a0aec0; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
  .modal-actions { display: flex; flex-direction: column; gap: 12px; }
  .btn-join { background: var(--tg-blue); color: white; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 600; }
  .btn-skip { background: transparent; color: #a0aec0; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; }

  /* Utilities */
  .loader-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 1; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--tg-blue); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* --- Mobile Optimization --- */
  @media (max-width: 600px) {
    .app-container { padding: 15px 10px; gap: 15px; }
    .glass-bar { padding: 10px 15px; }
    .support-text { display: none; } /* Maximize button space */
    .telegram-btn { width: 100%; padding: 14px 20px; }
    .search-input-group { flex-direction: column; }
    .search-btn { padding: 14px; justify-content: center; }
  }
</style>
</head>
<body>

<div class="ambient-light-1"></div>
<div class="ambient-light-2"></div>

<!-- Custom Periodic Toast Notification -->
<div class="promo-toast" id="periodic-toast">
  <div class="promo-icon">🍿</div>
  <div class="promo-text" id="toast-message">Bored from watching sport? Search for a movie below!</div>
  <div class="progress-bar"></div>
</div>

<div class="app-container">
  
  <!-- 1. Video Player Box -->
  <div class="player-wrapper">
    <div class="loader-container" id="loading-state">
      <div class="spinner"></div>
      <div style="font-size:12px;color:#a0aec0;font-weight:600;letter-spacing:1px;" id="status-message">Connecting...</div>
    </div>
    <iframe id="main-iframe" 
            allowfullscreen 
            allow="encrypted-media; fullscreen; autoplay" 
            sandbox="allow-scripts allow-same-origin allow-presentation"
            style="opacity: 0; transition: opacity 0.5s ease;">
    </iframe>
  </div>

  <!-- 2. Telegram Support Bar -->
  <div class="glass-bar">
    <span class="support-text">Support Us:</span>
    <a href="https://t.me/+w_oKk-2R2OgyNDNl" target="_blank" class="telegram-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" style="margin-right: -4px;">
        <path d="M9.993 15.674l-.398 5.604c.57 0 .817-.245 1.113-.54l2.67-2.557 5.53 4.047c1.014.558 1.734.264 1.987-.939l3.6-16.86.001-.001c.3-1.4-.506-1.95-1.496-1.58L1.27 9.64c-1.37.53-1.35 1.29-.233 1.64l5.68 1.77L19.29 5.73c.59-.39 1.13-.175.69.215"/>
      </svg>
      <span>Join @crixzy</span>
    </a>
  </div>

  <!-- 3. Movie Search Bar -->
  <div class="movie-search-wrapper">
    <div class="movie-search-header">
      <span>🎬</span> Ready for a Movie instead?
    </div>
    <div class="search-input-group">
      <input type="text" id="movie-input" class="search-input" placeholder="Enter movie name (e.g. Avatar 2007)">
      <button class="search-btn" id="movie-search-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        Search
      </button>
    </div>
  </div>

</div>

<!-- Initial Welcome Modal -->
<div class="modal-overlay" id="tg-modal">
  <div class="modal-content">
    <h2 style="color:#fff;">Welcome!</h2>
    <p>Get instant updates, backup links, and chat with the community. Don't miss out!</p>
    <div class="modal-actions">
      <a href="https://t.me/+w_oKk-2R2OgyNDNl" target="_blank" class="btn-join" id="btn-join-now">Join Telegram Channel</a>
      <button class="btn-skip" id="btn-skip">Maybe Later</button>
    </div>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {

  // --- INITIAL MODAL LOGIC ---
  const modal = document.getElementById('tg-modal');
  setTimeout(() => { modal.classList.add('active'); }, 500); // Slight delay for aesthetic
  const closeModal = () => modal.classList.remove('active');
  document.getElementById('btn-skip').addEventListener('click', closeModal);
  document.getElementById('btn-join-now').addEventListener('click', closeModal);

  // --- MOVIE SEARCH LOGIC ---
  const doMovieSearch = () => {
    const inputField = document.getElementById('movie-input');
    const query = inputField.value.trim();
    if (!query) return; // Do nothing if empty
    
    // Replace all spaces with underscores
    const formattedName = query.replace(/\s+/g, '_');
    
    // Construct the link and open in new tab
    const targetUrl = `https://t.me/crixzymovie2bot?start=nm_${formattedName}`;
    window.open(targetUrl, '_blank');
    
    inputField.value = ''; // Clear input after search
  };

  document.getElementById('movie-search-btn').addEventListener('click', doMovieSearch);
  document.getElementById('movie-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doMovieSearch();
  });

  // --- PERIODIC TOAST NOTIFICATION LOGIC ---
  const toast = document.getElementById('periodic-toast');
  const toastMsg = document.getElementById('toast-message');
  
  const promoVariations = [
    "Bored from watching sport? Search for a movie below!",
    "Match getting dull? Switch to a blockbuster movie!",
    "Want a break? Find your favorite movies below!",
    "Popcorn ready? Search for any movie instantly!"
  ];

  const triggerToast = () => {
    // Pick a random message
    toastMsg.innerText = promoVariations[Math.floor(Math.random() * promoVariations.length)];
    // Show toast
    toast.classList.add('show');
    
    // Auto skip (hide) after 5 seconds
    setTimeout(() => {
      toast.classList.remove('show');
    }, 5000);
  };

  // Run the popup every 20 minutes (20 mins * 60 seconds * 1000 ms)
  setInterval(triggerToast, 1200000);

  // --- VIDEO STREAM FETCHING LOGIC ---
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  const iframe = document.getElementById('main-iframe');
  const loader = document.getElementById('loading-state');
  const statusMsg = document.getElementById('status-message');

  if (id) {
    fetch('https://allrounder2-0.pages.dev/id.json')
      .then(res => res.json())
      .then(data => {
        const targetData = data.iframes.find(item => item.id === id);
        if (targetData && targetData.iframeSrc) {
          iframe.src = targetData.iframeSrc;
          iframe.onload = () => {
            loader.style.display = 'none';
            iframe.style.opacity = '1';
          };
          if (targetData.hit) fetch(targetData.hit).catch(() => {});
        } else {
          showError("Stream not found or expired.");
        }
      })
      .catch(() => showError("Failed to load stream data."));
  } else {
    showError("Invalid URL. No stream ID provided.");
  }

  function showError(msg) {
    const spinner = document.querySelector('.spinner');
    if (spinner) spinner.style.display = 'none';
    statusMsg.style.color = '#ff416c';
    statusMsg.innerText = msg;
  }

});
</script>
</body>
</html>
